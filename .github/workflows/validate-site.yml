name: Validate academic homepage
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
      - name: Validate editable content
        run: ruby scripts/validate_content.rb
      - name: Build with GitHub Pages
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Check generated homepage
        run: |
          test -s _site/index.html
          test -s _site/assets/css/academic.css
          test -s _site/docs/6th_lidar_conference.pdf
          grep -q 'id="publications"' _site/index.html
          ! grep -q '260000+' _site/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: academic-homepage
          path: _site/
          retention-days: 7
