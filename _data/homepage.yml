research:
  - title: LiDAR SLAM
    description: 3D simultaneous localization and mapping, including evaluation in forest environments.
  - title: Point Cloud Registration
    description: Automated multi-scan and cross-platform registration of forest point clouds.
  - title: Forest Structure Estimation
    description: Individual tree segmentation and tree attribute estimation from 3D observations.
  - title: LiDAR Data Analysis
    description: Airborne and terrestrial laser scanning, point cloud classification, and forest remote sensing.
