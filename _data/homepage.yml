cv: ""
intro: >-
  I am a Lecturer in the School of Remote Sensing Science and Technology at Aerospace
  Information Technology University (AITech), Jinan, China. I received my Ph.D. in
  Photogrammetry and Remote Sensing from Wuhan University in December 2025.
  My research focuses on LiDAR-based simultaneous localization and mapping (SLAM),
  automated point cloud registration, and 3D forest monitoring, including individual
  tree segmentation and forest structure estimation.
