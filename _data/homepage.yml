intro: >-
  I am a Ph.D. student in photogrammetry and remote sensing at Wuhan University.
  My research focuses on airborne LiDAR data processing and 3D LiDAR simultaneous
  localization and mapping (SLAM), with interests in forest environments and point cloud analysis.
