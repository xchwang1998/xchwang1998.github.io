research:
  - title: LiDAR SLAM
    description: 3D simultaneous localization and mapping, including evaluation in forest environments.
  - title: Point Cloud Analysis
    description: Airborne LiDAR data processing, waveform features, and point cloud classification.
  - title: Localization & Calibration
    description: Place recognition and extrinsic calibration.
  - title: Machine Learning
    description: Learning methods for remote sensing and 3D data analysis.
